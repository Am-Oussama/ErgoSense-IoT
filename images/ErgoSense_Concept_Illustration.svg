<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740" role="img" aria-label="Concept illustration of the ErgoSense wearable on the upper back, with a close-up of the device and its parts" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1AA394"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5E7EB"/>
      <stop offset="1" stop-color="#D1D5DB"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="740" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="42" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#134E4A">ErgoSense: concept illustration of the final version</text>
  <text x="30" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6B7280">Illustration, not a photograph. Target size about 45 x 32 x 12 mm (estimate). Details may change after prototyping.</text>

  <!-- Panels -->
  <rect x="30" y="90" width="470" height="610" rx="18" fill="#F3F4F6"/>
  <rect x="530" y="90" width="540" height="610" rx="18" fill="#F7F8FA"/>

  <!-- LEFT PANEL: person, back view -->
  <g transform="translate(35,70)">
    <!-- arms -->
    <path d="M140 228 L104 340 L128 350 L162 250 Z" fill="url(#skin)"/>
    <path d="M320 228 L356 340 L332 350 L298 250 Z" fill="url(#skin)"/>
    <!-- torso -->
    <path d="M140 228 C140 202 175 192 195 190 L265 190 C285 192 320 202 320 228 L342 440 C343 470 328 482 308 484 L152 484 C132 482 117 470 118 440 Z" fill="url(#skin)"/>
    <!-- neck and head -->
    <rect x="211" y="156" width="38" height="40" rx="12" fill="#D1D5DB"/>
    <ellipse cx="230" cy="122" rx="42" ry="50" fill="#D1D5DB"/>
    <!-- shoulder blade hints -->
    <ellipse cx="193" cy="300" rx="30" ry="42" fill="#C9CED6" opacity="0.7"/>
    <ellipse cx="267" cy="300" rx="30" ry="42" fill="#C9CED6" opacity="0.7"/>
    <!-- spine line -->
    <line x1="230" y1="196" x2="230" y2="480" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 5"/>
    <!-- device on upper back -->
    <rect x="215" y="241" width="30" height="22" rx="7" fill="url(#body)" stroke="#0B5B54" stroke-width="1.5"/>
    <circle cx="222" cy="247" r="2.2" fill="#FDE68A"/>
    <circle cx="230" cy="252" r="30" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="5 4"/>
  </g>
  <text x="265" y="640" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#134E4A">Back view</text>
  <text x="265" y="662" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6B7280">Worn on the upper back, between the shoulder blades</text>

  <!-- connector from worn device to close-up -->
  <path d="M300 322 C 430 322, 540 270, 640 270" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- RIGHT PANEL: close-up -->
  <g transform="translate(640,150)">
    <!-- strap loop for optional cord -->
    <path d="M140 2 C140 -36 200 -36 200 2" fill="none" stroke="#134E4A" stroke-width="7" stroke-linecap="round"/>
    <!-- body -->
    <rect x="0" y="0" width="340" height="240" rx="46" fill="url(#body)" stroke="#0B5B54" stroke-width="3"/>
    <rect x="12" y="8" width="316" height="62" rx="40" fill="#FFFFFF" opacity="0.08"/>
    <!-- LED -->
    <circle cx="62" cy="52" r="9" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
    <!-- button -->
    <circle cx="278" cy="60" r="24" fill="#134E4A" stroke="#A7D8D1" stroke-width="3"/>
    <circle cx="278" cy="60" r="10" fill="#0F766E"/>
    <!-- USB-C slot -->
    <rect x="140" y="228" width="60" height="12" rx="6" fill="#0B2F2C"/>
    <!-- logo -->
    <text x="170" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">ErgoSense</text>
    <text x="170" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#CFEDE8">posture and break reminder</text>

    <!-- number markers -->
    <g font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <circle cx="98" cy="52" r="13" fill="#134E4A" stroke="#FFFFFF" stroke-width="2"/><text x="98" y="57" fill="#FFFFFF">1</text>
      <circle cx="314" cy="28" r="13" fill="#134E4A" stroke="#FFFFFF" stroke-width="2"/><text x="314" y="33" fill="#FFFFFF">2</text>
      <circle cx="170" cy="268" r="13" fill="#134E4A" stroke="#FFFFFF" stroke-width="2"/><text x="170" y="273" fill="#FFFFFF">3</text>
      <circle cx="226" cy="-22" r="13" fill="#134E4A" stroke="#FFFFFF" stroke-width="2"/><text x="226" y="-17" fill="#FFFFFF">4</text>
    </g>
  </g>

  <!-- Legend -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1F2937">
    <g font-weight="700" font-size="13" text-anchor="middle" fill="#FFFFFF">
      <circle cx="572" cy="455" r="12" fill="#134E4A"/><text x="572" y="460">1</text>
      <circle cx="572" cy="489" r="12" fill="#134E4A"/><text x="572" y="494">2</text>
      <circle cx="572" cy="523" r="12" fill="#134E4A"/><text x="572" y="528">3</text>
      <circle cx="572" cy="557" r="12" fill="#134E4A"/><text x="572" y="562">4</text>
    </g>
    <text x="596" y="460">Status LED: mode, battery, calibration</text>
    <text x="596" y="494">Button: change mode, calibrate, pause alerts</text>
    <text x="596" y="528">USB-C port: charging and programming</text>
    <text x="596" y="562">Loop for the optional cord or pendant strap</text>
    <text x="560" y="600" font-size="13" fill="#6B7280">Inside: XIAO ESP32-C3 board, motion sensor (IMU), LiPo battery, coin vibration motor</text>
  </g>

  <!-- Side view -->
  <g transform="translate(640,630)">
    <rect x="-6" y="48" width="192" height="5" rx="2" fill="#E3CFA2"/>
    <rect x="0" y="0" width="180" height="48" rx="16" fill="url(#body)" stroke="#0B5B54" stroke-width="2"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1F2937">
      <text x="212" y="18" font-weight="700">Side view</text>
      <text x="212" y="38" fill="#6B7280">Enclosure about 12 mm thick</text>
      <text x="212" y="56" fill="#6B7280">Replaceable skin-safe adhesive patch</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
